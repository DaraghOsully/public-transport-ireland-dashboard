name: Refresh source data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download latest CSO/TII datasets
        run: node scripts/update-data.mjs

      - name: Commit changed source data
        run: |
          if git diff --quiet -- THA25.csv TII03.csv public/data-meta.json; then
            echo 'Source datasets are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add THA25.csv TII03.csv public/data-meta.json
          git commit -m 'chore: refresh transport source data'
          git push origin HEAD:v1-foundation
